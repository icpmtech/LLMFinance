<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 690" width="440" height="690" role="img" aria-label="Método em três passos: recolher, ligar e provar">
  <rect width="440" height="690" fill="#f1f5f9"/>
  <g>
    <rect x="16" y="16" width="408" height="180" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
    <circle cx="48" cy="60" r="19" fill="#0ea5a4"/>
    <text x="48" y="67" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="80" y="68" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Recolher</text>
    <text x="36" y="116" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Só fontes públicas, com</text>
    <text x="36" y="142" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">cobertura e período à vista.</text>
    <rect x="36" y="168" width="88" height="9" rx="4.5" fill="#0ea5a4"/>
  </g>
  <g>
    <rect x="16" y="216" width="408" height="180" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
    <circle cx="48" cy="260" r="19" fill="#38bdf8"/>
    <text x="48" y="267" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="80" y="268" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Ligar</text>
    <text x="36" y="316" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Cruzamos pelo NIF da entidade,</text>
    <text x="36" y="342" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">não pelo nome parecido.</text>
    <rect x="36" y="368" width="112" height="9" rx="4.5" fill="#38bdf8"/>
  </g>
  <g>
    <rect x="16" y="416" width="408" height="180" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
    <circle cx="48" cy="460" r="19" fill="#6366f1"/>
    <text x="48" y="467" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="80" y="468" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Provar</text>
    <text x="36" y="516" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Cada afirmação sai com a</text>
    <text x="36" y="542" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">evidência que a sustenta.</text>
    <rect x="36" y="568" width="136" height="9" rx="4.5" fill="#6366f1"/>
  </g>
  <rect x="16" y="616" width="408" height="48" rx="14" fill="#0f172a"/>
  <text x="220" y="645" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#e2e8f0" text-anchor="middle">Todos os passos guardam a data da leitura</text>
</svg>
