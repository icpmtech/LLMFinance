<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Formação de contratação pública em um dia">
  <defs>
    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5a4"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#f1f5f9"/>
  <rect x="48" y="56" width="704" height="404" rx="22" fill="#ffffff" stroke="#dbe3ec"/>
  <text x="80" y="112" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Formação em 1 dia</text>
  <text x="80" y="142" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">Contratação pública, presencial ou online, para equipas</text>
  <line x1="128" y1="196" x2="128" y2="384" stroke="#dbe3ec" stroke-width="3"/>
  <g>
    <circle cx="128" cy="196" r="10" fill="#0ea5a4"/>
    <circle cx="128" cy="258" r="10" fill="#14b8a6"/>
    <circle cx="128" cy="320" r="10" fill="#38bdf8"/>
    <circle cx="128" cy="382" r="10" fill="#6366f1"/>
  </g>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">
    <text x="162" y="202">09h30 · Como se lê um contrato</text>
    <text x="162" y="264">11h00 · Preços, aditivos e prazos</text>
    <text x="162" y="326">14h00 · Oficina de dados abertos</text>
    <text x="162" y="388">16h30 · Casos da sua carteira</text>
  </g>
  <g fill="#cbd5e1">
    <rect x="162" y="214" width="230" height="9" rx="4.5"/>
    <rect x="162" y="276" width="190" height="9" rx="4.5"/>
    <rect x="162" y="338" width="214" height="9" rx="4.5"/>
    <rect x="162" y="400" width="168" height="9" rx="4.5"/>
  </g>
  <rect x="560" y="196" width="160" height="152" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="640" y="262" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0ea5a4">1</text>
  <text x="640" y="296" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">dia intensivo</text>
  <text x="640" y="322" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">6 lugares por turma</text>
