<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Relatório de benchmark de preços entre Portugal, Espanha e França">
  <defs>
    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5a4"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#f1f5f9"/>
  <rect x="48" y="56" width="704" height="404" rx="22" fill="#ffffff" stroke="#dbe3ec"/>
  <text x="80" y="112" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Benchmark de preços</text>
  <text x="80" y="142" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">O mesmo segmento em três países, com o cruzamento entre eles</text>
  <g>
    <rect x="80" y="176" width="200" height="204" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="300" y="176" width="200" height="204" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="520" y="176" width="200" height="204" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  </g>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">
    <text x="104" y="214">Portugal</text>
    <text x="324" y="214">Espanha</text>
    <text x="544" y="214">França</text>
  </g>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0ea5a4">
    <text x="104" y="276">749 €</text>
    <text x="324" y="276">949 €</text>
    <text x="544" y="276">889 €</text>
  </g>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">
    <text x="104" y="306">mediana do segmento</text>
    <text x="324" y="306">mediana do segmento</text>
    <text x="544" y="306">mediana do segmento</text>
  </g>
  <g fill="#cbd5e1">
    <rect x="104" y="326" width="140" height="10" rx="5"/>
    <rect x="324" y="326" width="112" height="10" rx="5"/>
    <rect x="544" y="326" width="126" height="10" rx="5"/>
    <rect x="104" y="348" width="96" height="10" rx="5"/>
    <rect x="324" y="348" width="140" height="10" rx="5"/>
    <rect x="544" y="348" width="88" height="10" rx="5"/>
  </g>
  <rect x="80" y="398" width="152" height="32" rx="16" fill="#0ea5a4"/>
  <text x="156" y="419" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#04252a">PDF automático</text>
  <text x="248" y="419" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#64748b">Índice de preço, posição e quota da empresa</text>
  <rect x="48" y="500" width="30" height="30" rx="9" fill="url(#marca)"/>
  <g fill="#ffffff">
    <rect x="55" y="514" width="4.5" height="9" rx="2"/>
    <rect x="61.5" y="509" width="4.5" height="14" rx="2"/>
    <rect x="68" y="504" width="4.5" height="19" rx="2"/>
  </g>
  <text x="90" y="521" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Sabemos</text>
  <text x="752" y="521" text-anchor="end" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Entrega imediata após pagamento</text>
</svg>
