# nginx do contentor `osif-frontend`.
#
# Só serve a SPA (history mode). O `/api/...`, `/ws/...` e `/health` são
# encaminhados para `osif-backend:6000` pelo nginx do IQ OS na porta de
# incorporação (8894) — ver `docker/nginx.conf`. Fazer o proxy aqui obrigaria a
# `proxy_pass http://osif-backend:6000` a resolver no arranque e um backend
# ausente derrubava este contentor.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sem cache para o documento: uma atualização da app tem de chegar ao browser.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
