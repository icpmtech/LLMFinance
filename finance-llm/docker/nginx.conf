server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads de PDF/documentos e importações de ficheiros passam por aqui
    client_max_body_size 256m;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Suporte a SPA React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index.html nunca deve ficar em cache (senão o build novo não aparece)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Assets com hash no nome podem ser cacheados indefinidamente
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA: o service worker e o manifest nunca devem ser servidos de cache
    # (caso contrário uma versão antiga do worker fica "presa").
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Proxy para a API FastAPI (todos os endpoints: /api/tickers -> /tickers)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O chat usa SSE: sem buffering e com timeout longo, senão a resposta "corta".
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Gráficos de previsão servidos diretamente pelo backend
    location /forecast/plot/ {
        proxy_pass http://backend:8000/forecast/plot/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
