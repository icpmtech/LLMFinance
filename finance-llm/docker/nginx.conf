# Suporte a WebSocket (n8n) no proxy de incorporação.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Esquema original do pedido. O Caddy do edge envia `X-Forwarded-Proto: https`;
# um acesso directo (LAN/túnel local) não envia nada e usa-se o esquema da ligação.
# É preciso porque o dashboard do Hermes constrói `Location` absolutos com
# `http://`, e um `302` para http dentro de um iframe https é bloqueado pelo
# browser (mixed content).
map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads de PDF/documentos e importações de ficheiros passam por aqui
    client_max_body_size 256m;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Suporte a SPA React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index.html nunca deve ficar em cache (senão o build novo não aparece)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Assets com hash no nome podem ser cacheados indefinidamente
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA: o service worker e o manifest nunca devem ser servidos de cache
    # (caso contrário uma versão antiga do worker fica "presa").
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.webmanifest {
        # O nginx não conhece a extensão `.webmanifest`: sem isto o ficheiro sai
        # como `application/octet-stream` e alguns browsers ignoram o manifest.
        types {
            application/manifest+json webmanifest;
        }
        add_header Cache-Control "no-cache";
    }

    # Proxy para a API FastAPI (todos os endpoints: /api/tickers -> /tickers)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O chat usa SSE: sem buffering e com timeout longo, senão a resposta "corta".
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Gráficos de previsão servidos diretamente pelo backend
    location /forecast/plot/ {
        proxy_pass http://backend:8000/forecast/plot/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hermes Agent dashboard servido sob o mesmo domínio da SPA (same-origin).
    # O proxy de incorporação na porta 8892 continua a existir para uso local;
    # aqui expõe-se o dashboard também no subcaminho /hermes-agent/ para que o
    # iframe público em https://sabemos.studio/iframe/iqos-hermes-agent carregue
    # sem problemas de cookies cross-origin (SameSite=Lax).
    #
    # A app do Hermes gera URLs absolutos a partir da raiz (`/auth/password-login`,
    # `/fonts/...`, redirects `/login`). Injeta-se `<base href="/hermes-agent/">`
    # nas páginas HTML para que o browser resolva esses caminhos no subcaminho; os
    # cabeçalhos `Location` são reescritos de volta para o prefixo.
    location /hermes-agent/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $hermes_upstream hermes-agent:9119;

        # Com variável no proxy_pass o prefixo não é removido automaticamente;
        # reescrevemos o URI para a app Hermes ver só o caminho interno.
        rewrite ^/hermes-agent/(.*) /$1 break;

        proxy_pass http://$hermes_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        # Reescreve redirects absolutos da app (que conhece só a raiz) para o
        # subcaminho *e* para o esquema original (`http://host/login` →
        # `https://host/hermes-agent/login`), senão o browser bloqueia o 302
        # como mixed content dentro do iframe https. Funciona para /, /login,
        # /auth/..., /api/... etc.
        proxy_redirect http://$host/ $forwarded_scheme://$host/hermes-agent/;
        proxy_redirect / $forwarded_scheme://$host/hermes-agent/;
        # O Accept-Encoding vazio força o upstream a devolver texto plano;
        # sem isso o sub_filter não consegue reescrever respostas comprimidas.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types *;
        sub_filter '<head>' '<head><base href="/hermes-agent/"><script>window.__HERMES_BASE_PATH__="/hermes-agent";</script><script>(function(){try{var p=location.pathname;if(p.indexOf("/login")<0)return;if(sessionStorage.getItem("iqos-sso")==="1")return;var t=localStorage.getItem("finance-llm-token");if(!t)return;sessionStorage.setItem("iqos-sso","1");fetch("/hermes-agent/auth/password-login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({provider:"iqos",username:"iqos-sso",password:t})}).then(function(r){if(r.ok){location.replace("/hermes-agent/")}else{sessionStorage.removeItem("iqos-sso")}}).catch(function(){sessionStorage.removeItem("iqos-sso")})}catch(e){}})();</script>';
        # O servidor do Hermes injeta `window.__HERMES_BASE_PATH__=""` (e a SPA
        # calcula a partir dele o prefixo de todos os pedidos /api/ e o basename
        # do router). Reescrevemos para o subcaminho.
        sub_filter 'window.__HERMES_BASE_PATH__=""' 'window.__HERMES_BASE_PATH__="/hermes-agent"';
        # O dashboard do Hermes emite caminhos absolutos /assets/...,
        # /fonts/..., /api/... e /auth/... que ignoram <base href>.
        # Reescrevemos directamente para o subcaminho.
        sub_filter 'src="/assets/' 'src="/hermes-agent/assets/';
        sub_filter 'href="/assets/' 'href="/hermes-agent/assets/';
        sub_filter 'href="/fonts/' 'href="/hermes-agent/fonts/';
        sub_filter 'url(\"/fonts/' 'url(\"/hermes-agent/fonts/';
        sub_filter 'url(\'/fonts/' "url('/hermes-agent/fonts/";
        sub_filter '\"/auth/password-login\"' '\"/hermes-agent/auth/password-login\"';
        sub_filter 'fetch(\'/auth/password-login\'' "fetch('/hermes-agent/auth/password-login'";
        sub_filter 'fetch(\"/auth/password-login\"' 'fetch(\"/hermes-agent/auth/password-login\"';
        sub_filter 'fetch(`/auth/password-login`' 'fetch(`/hermes-agent/auth/password-login`';
        sub_filter 'fetch(\'/api/' "fetch('/hermes-agent/api/";
        sub_filter 'fetch(\"/api/' 'fetch(\"/hermes-agent/api/';
        sub_filter 'fetch(`/api/`' 'fetch(`/hermes-agent/api/`';
        # A página de login navega para `next` (o servidor devolve `/`), o que
        # atiraria o iframe para a raiz da SPA. Prefixamos o destino com o
        # subcaminho do Hermes: `/` -> `/hermes-agent/`, `/logs` -> `/hermes-agent/logs`.
        sub_filter 'window.location.assign((data && data.next) || \'/\')' 'window.location.assign("/hermes-agent" + ((data && data.next) || "/"))';
        # O Vite gera modulepreload e __vite__mapDeps com caminhos relativos
        # "assets/..." (sem leading slash). O <base href> resolve imports
        # dinâmicos, mas os modulepreload injetados a posteriori ficam
        # relativos à raiz. Prefixamos tudo com hermes-agent/.
        sub_filter '"assets/' '"hermes-agent/assets/';
        sub_filter "'assets/" "'hermes-agent/assets/";
        sub_filter '`assets/' '`hermes-agent/assets/';
        # CSS dos temas (`url(/assets/...woff2)`) e do terminal.
        sub_filter 'url(/assets/' 'url(/hermes-agent/assets/';
        sub_filter 'url(/fonts-terminal/' 'url(/hermes-agent/fonts-terminal/';
        sub_filter 'url(/fonts/' 'url(/hermes-agent/fonts/';
    }
}

# ---------------------------------------------------------------------------
# Proxy de incorporação (iframe) das aplicações de apoio.
#
# O n8n e o dashboard do Hermes enviam `X-Frame-Options` / `Content-Security-Policy`,
# o que impede a SPA de os mostrar dentro de um iframe. Cada app é replicada no
# seu **próprio porto** (e não num subcaminho) para que os caminhos absolutos
# que a app gera continuem a resolver; aqui só se retiram esses cabeçalhos.
# As páginas iframe da SPA apontam para estes portos.
# ---------------------------------------------------------------------------
server {
    listen 8891;
    server_name localhost;

    # O resolver do Docker + variável fazem a resolução **em tempo de pedido**:
    # sem isto o nginx não arrancava quando o upstream não existe (ex.: perfil
    # desativado), e uma indisponibilidade derrubava o frontend inteiro.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $n8n_upstream n8n:5678;

    # n8n (editor de workflows) — página «n8n» na SPA.
    location / {
        proxy_pass http://$n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
    }
}

server {
    listen 8892;
    server_name localhost;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $hermes_upstream hermes-agent:9119;

    # Dashboard web do Hermes Agent — página «Hermes Agent» na SPA.
    #
    # O login é feito **dentro** do dashboard e validado contra a API do IQ OS pelo
    # plugin `docker/hermes/plugins/dashboard-auth-iqos` (o formulário «Sign in with
    # Username & Password» usa as mesmas contas da plataforma). Aqui só se replica a
    # app num porto próprio (para os caminhos absolutos continuarem válidos) e se
    # retiram os cabeçalhos que impediriam a incorporação num iframe.
    location / {
        proxy_pass http://$hermes_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
    }
}

# ---------------------------------------------------------------------------
# MiroFish (motor de previsão por enxame de agentes) — página «MiroFish» na SPA.
#
# O container do MiroFish corre **frontend + backend na mesma imagem**:
#   * frontend (Vite dev server) .... mirofish:3000 — é o documento do iframe
#   * backend (Flask/API) ........... mirofish:5001 — endpoints em `/api/...`
#
# A app é incorporada por um porto próprio (e não por um subcaminho) para os
# caminhos absolutos que gera continuarem a resolver; aqui só se retiram os
# cabeçalhos que impediriam o iframe.
# ---------------------------------------------------------------------------
server {
    listen 8893;
    server_name localhost;

    # O MiroFish aceita materiais-semente (PDF/MD/TXT) até 50 MB.
    client_max_body_size 256m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $mirofish_ui_upstream mirofish:3000;
    set $mirofish_api_upstream mirofish:5001;

    # API do MiroFish. A SPA chama `/api/...` **na origem da página**: o patch
    # em `docker/mirofish/Dockerfile` torna a base da API relativa, pelo que os
    # pedidos chegam aqui e seguem diretos para o Flask (sem depender do proxy
    # do Vite). Os tempos são longos: gerar a ontologia, construir o grafo e
    # correr uma simulação são operações de minutos (o cliente espera 300 s).
    #
    # Sem o contentor `mirofish` a correr (perfil desativado ou chaves em falta,
    # que impedem o backend dele de arrancar) o proxy devolve 502: em vez de uma
    # página de erro do nginx, a API responde em JSON com o que fazer.
    location /api/ {
        error_page 502 503 504 = @mirofish_api_offline;
        proxy_pass http://$mirofish_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Há endpoints de log em streaming (SSE) e o progresso é consultado em
        # ciclos curtos: sem buffering, para as respostas não ficarem presas.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Frontend do MiroFish (Vite dev server). O `Host` é reescrito porque o dev
    # server do Vite recusa pedidos cujo `Host` não seja `localhost` nem um IP
    # literal (proteção contra DNS rebinding): sem isto a app só abria em
    # `127.0.0.1` e respondia «Blocked request. This host is not allowed.»
    # através do IP da LAN ou de um túnel.
    #
    # Sem o contentor `mirofish` a correr, o iframe mostraria um 502 cru: serve-se
    # uma página que explica o que falta e como arrancar o serviço.
    location / {
        error_page 502 503 504 = @mirofish_offline;
        proxy_pass http://$mirofish_ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
    }

    # Resposta da API quando o serviço está em baixo (JSON, para o frontend).
    location @mirofish_api_offline {
        default_type application/json;
        return 502 '{"success":false,"error":"MiroFish indisponivel. Arranque o servico (docker compose --profile mirofish up -d) e confirme MIROFISH_ZEP_API_KEY e MIROFISH_LLM_API_KEY no .env.","offline":true}';
    }

    # Página de aviso mostrada no iframe enquanto o serviço não estiver a correr.
    location @mirofish_offline {
        default_type text/html;
        return 200 '<!doctype html><html lang="pt"><head><meta charset="utf-8"><title>MiroFish indisponivel</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#09090b;color:#e4e4e7;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:640px;padding:32px;border:1px solid #27272a;border-radius:16px;background:#18181b}h1{margin:0 0 8px;font-size:20px;color:#67e8f9}p{margin:0 0 12px;line-height:1.55;color:#a1a1aa}code{background:#27272a;padding:2px 6px;border-radius:6px;color:#f4f4f5;font-size:13px}ol{margin:0;padding-left:20px;color:#a1a1aa;line-height:1.7}</style></head><body><main><h1>MiroFish nao esta a correr</h1><p>O motor de simulacao responde pelo porto 8893, mas o contentor nao existe ou caiu no arranque. O backend do MiroFish recusa arrancar sem chaves.</p><ol><li>Definir <code>MIROFISH_LLM_API_KEY</code> (ou <code>OPENAI_API_KEY</code>) e <code>MIROFISH_ZEP_API_KEY</code> no <code>.env</code>.</li><li>Arrancar o perfil: <code>docker compose --profile mirofish up -d</code>.</li><li>Ver o que falta: <code>docker compose --profile mirofish logs mirofish</code>.</li></ol><p>Na plataforma, a pagina <code>MiroFish</code> mostra o diagnostico e as fontes de dados do sistema.</p></main></body></html>';
    }
}

# ---------------------------------------------------------------------------
# OSIF — OSINT Framework v2 (https://github.com/fr4nc1stein/osint-framework):
# página «OSINT Framework (OSIF)» na SPA.
#
# A app tem duas peças: a SPA Vue (`osif-frontend:80`, o documento do iframe) e a
# API FastAPI + WebSocket (`osif-backend:6000`). A SPA usa caminhos **relativos**
# (`baseURL: ''` em `src/api/client.js`), por isso este vhost faz o encaminhamento
# todo: `/` → SPA; `/api/`, `/ws/`, `/health` e `/ready` → API. É replicada num
# porto próprio (e não num subcaminho) para os caminhos absolutos que gera
# continuarem válidos; aqui também se retiram os cabeçalhos que impediriam a
# incorporação. Sem o perfil `osif` a correr, mostra-se uma página de aviso em
# vez de um 502 cru.
# ---------------------------------------------------------------------------
server {
    listen 8894;
    server_name localhost;

    # Upload de evidências (25 MB no OSIF) com folga.
    client_max_body_size 64m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $osif_ui_upstream osif-frontend:80;
    set $osif_api_upstream osif-backend:6000;

    # API REST do OSIF (casos, scans, módulos, grafo, evidências, export).
    location /api/ {
        error_page 502 503 504 = @osif_api_offline;
        proxy_pass http://$osif_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # WebSocket de progresso dos scans (/ws/scan/{id}).
    location /ws/ {
        error_page 502 503 504 = @osif_api_offline;
        proxy_pass http://$osif_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Sondas de saúde: ficam na raiz da API (a SPA chama /health no arranque).
    location = /health {
        error_page 502 503 504 = @osif_api_offline;
        proxy_pass http://$osif_api_upstream;
        proxy_set_header Host $host;
    }

    location = /ready {
        error_page 502 503 504 = @osif_api_offline;
        proxy_pass http://$osif_api_upstream;
        proxy_set_header Host $host;
    }

    # SPA do OSIF (Vue, history mode) — documento do iframe.
    location / {
        error_page 502 503 504 = @osif_offline;
        proxy_pass http://$osif_ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # O `index.html` do upstream traz `<title>frontend</title>`; troca-se por
        # um nome legível (separador do browser). `Accept-Encoding` vazio porque o
        # `sub_filter` não consegue reescrever respostas comprimidas.
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '<title>frontend</title>' '<title>OSINT Framework (OSIF)</title>';
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
    }

    # Resposta da API quando o serviço está em baixo (JSON, para a SPA).
    location @osif_api_offline {
        default_type application/json;
        return 502 '{"detail":"OSIF indisponivel. Arranque o perfil: docker compose --profile osif up -d --build (codigo em docker/osif/src, ver docker/osif/README.md).","offline":true}';
    }

    # Página de aviso mostrada no iframe enquanto o serviço não estiver a correr.
    location @osif_offline {
        default_type text/html;
        return 200 '<!doctype html><html lang="pt"><head><meta charset="utf-8"><title>OSIF indisponivel</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#09090b;color:#e4e4e7;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:680px;padding:32px;border:1px solid #27272a;border-radius:16px;background:#18181b}h1{margin:0 0 8px;font-size:20px;color:#34d399}p{margin:0 0 12px;line-height:1.55;color:#a1a1aa}code{background:#27272a;padding:2px 6px;border-radius:6px;color:#f4f4f5;font-size:13px}ol{margin:0;padding-left:20px;color:#a1a1aa;line-height:1.7}</style></head><body><main><h1>OSINT Framework (OSIF) nao esta a correr</h1><p>O porto 8894 responde, mas os contentores do OSIF nao existem ou cairam. A app e uma stack propria (PostgreSQL + Redis + MinIO + API + worker + SPA).</p><ol><li>Obter o codigo do upstream: <code>powershell -ExecutionPolicy Bypass -File docker/osif/fetch.ps1</code>.</li><li>Arrancar o perfil: <code>docker compose --profile osif up -d --build</code>.</li><li>Ver o que falta: <code>docker compose --profile osif logs osif-backend osif-worker</code>.</li></ol><p>As chaves de APIs OSINT sao opcionais: sem elas funcionam dns_records, subdomain_enum, whois_lookup, ip_geolocation, urlscan_lookup e email_domain.</p></main></body></html>';
    }
}
