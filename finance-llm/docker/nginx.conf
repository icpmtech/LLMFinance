# Suporte a WebSocket (n8n) no proxy de incorporação.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads de PDF/documentos e importações de ficheiros passam por aqui
    client_max_body_size 256m;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Suporte a SPA React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index.html nunca deve ficar em cache (senão o build novo não aparece)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Assets com hash no nome podem ser cacheados indefinidamente
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA: o service worker e o manifest nunca devem ser servidos de cache
    # (caso contrário uma versão antiga do worker fica "presa").
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.webmanifest {
        # O nginx não conhece a extensão `.webmanifest`: sem isto o ficheiro sai
        # como `application/octet-stream` e alguns browsers ignoram o manifest.
        types {
            application/manifest+json webmanifest;
        }
        add_header Cache-Control "no-cache";
    }

    # Proxy para a API FastAPI (todos os endpoints: /api/tickers -> /tickers)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O chat usa SSE: sem buffering e com timeout longo, senão a resposta "corta".
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Gráficos de previsão servidos diretamente pelo backend
    location /forecast/plot/ {
        proxy_pass http://backend:8000/forecast/plot/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ---------------------------------------------------------------------------
# Proxy de incorporação (iframe) das aplicações de apoio.
#
# O n8n e o dashboard do Hermes enviam `X-Frame-Options` / `Content-Security-Policy`,
# o que impede a SPA de os mostrar dentro de um iframe. Cada app é replicada no
# seu **próprio porto** (e não num subcaminho) para que os caminhos absolutos
# que a app gera continuem a resolver; aqui só se retiram esses cabeçalhos.
# As páginas iframe da SPA apontam para estes portos.
# ---------------------------------------------------------------------------
server {
    listen 8891;
    server_name localhost;

    # O resolver do Docker + variável fazem a resolução **em tempo de pedido**:
    # sem isto o nginx não arrancava quando o upstream não existe (ex.: perfil
    # desativado), e uma indisponibilidade derrubava o frontend inteiro.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $n8n_upstream n8n:5678;

    # n8n (editor de workflows) — página «n8n» na SPA.
    location / {
        proxy_pass http://$n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
    }
}

server {
    listen 8892;
    server_name localhost;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $hermes_upstream hermes-agent:9119;

    # Dashboard web do Hermes Agent — página «Hermes Agent» na SPA.
    #
    # O login é feito **dentro** do dashboard e validado contra a API do IQ OS pelo
    # plugin `docker/hermes/plugins/dashboard-auth-iqos` (o formulário «Sign in with
    # Username & Password» usa as mesmas contas da plataforma). Aqui só se replica a
    # app num porto próprio (para os caminhos absolutos continuarem válidos) e se
    # retiram os cabeçalhos que impediriam a incorporação num iframe.
    location / {
        proxy_pass http://$hermes_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
    }
}

# ---------------------------------------------------------------------------
# MiroFish (motor de previsão por enxame de agentes) — página «MiroFish» na SPA.
#
# O container do MiroFish corre **frontend + backend na mesma imagem**:
#   * frontend (Vite dev server) .... mirofish:3000 — é o documento do iframe
#   * backend (Flask/API) ........... mirofish:5001 — endpoints em `/api/...`
#
# A app é incorporada por um porto próprio (e não por um subcaminho) para os
# caminhos absolutos que gera continuarem a resolver; aqui só se retiram os
# cabeçalhos que impediriam o iframe.
# ---------------------------------------------------------------------------
server {
    listen 8893;
    server_name localhost;

    # O MiroFish aceita materiais-semente (PDF/MD/TXT) até 50 MB.
    client_max_body_size 256m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $mirofish_ui_upstream mirofish:3000;
    set $mirofish_api_upstream mirofish:5001;

    # API do MiroFish. A SPA chama `/api/...` **na origem da página**: o patch
    # em `docker/mirofish/Dockerfile` torna a base da API relativa, pelo que os
    # pedidos chegam aqui e seguem diretos para o Flask (sem depender do proxy
    # do Vite). Os tempos são longos: gerar a ontologia, construir o grafo e
    # correr uma simulação são operações de minutos (o cliente espera 300 s).
    location /api/ {
        proxy_pass http://$mirofish_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Há endpoints de log em streaming (SSE) e o progresso é consultado em
        # ciclos curtos: sem buffering, para as respostas não ficarem presas.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Frontend do MiroFish (Vite dev server). O `Host` é reescrito porque o dev
    # server do Vite recusa pedidos cujo `Host` não seja `localhost` nem um IP
    # literal (proteção contra DNS rebinding): sem isto a app só abria em
    # `127.0.0.1` e respondia «Blocked request. This host is not allowed.»
    # através do IP da LAN ou de um túnel.
    location / {
        proxy_pass http://$mirofish_ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
    }
}
