<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" aria-label="Método em três passos: recolher, ligar e provar">
  <rect width="1100" height="400" fill="#f1f5f9"/>
  <g>
    <rect x="40" y="64" width="320" height="230" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
    <circle cx="80" cy="106" r="19" fill="#0ea5a4"/>
    <text x="80" y="113" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="64" y="166" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Recolher</text>
    <text x="64" y="200" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Só fontes públicas, com</text>
    <text x="64" y="222" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">cobertura e período à vista.</text>
    <rect x="64" y="254" width="88" height="8" rx="4" fill="#0ea5a4"/>
  </g>
  <g>
    <rect x="390" y="64" width="320" height="230" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
    <circle cx="430" cy="106" r="19" fill="#38bdf8"/>
    <text x="430" y="113" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="414" y="166" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Ligar</text>
    <text x="414" y="200" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Cruzamos pelo NIF da</text>
    <text x="414" y="222" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">entidade, não pelo nome.</text>
    <rect x="414" y="254" width="112" height="8" rx="4" fill="#38bdf8"/>
  </g>
  <g>
    <rect x="740" y="64" width="320" height="230" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
    <circle cx="780" cy="106" r="19" fill="#6366f1"/>
    <text x="780" y="113" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="764" y="166" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Provar</text>
    <text x="764" y="200" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Cada afirmação sai com a</text>
    <text x="764" y="222" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">evidência que a sustenta.</text>
    <rect x="764" y="254" width="136" height="8" rx="4" fill="#6366f1"/>
  </g>
  <rect x="40" y="330" width="1020" height="44" rx="14" fill="#0f172a"/>
  <text x="550" y="358" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">Todos os passos guardam a data da leitura.</text>
</svg>
