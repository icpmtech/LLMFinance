<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-label="Concentração de mercado e preço dentro do mesmo CPV">
  <rect width="1100" height="440" fill="#f1f5f9"/>
  <rect x="40" y="56" width="500" height="288" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
  <text x="70" y="94" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Preço dentro do mesmo CPV</text>
  <text x="70" y="118" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">mediana e percentis em vez de médias</text>
  <path d="M70 300 C130 300 160 168 215 168 C270 168 300 238 370 274 C430 300 470 300 510 300" fill="none" stroke="#0ea5a4" stroke-width="3"/>
  <path d="M70 300 L510 300" stroke="#94a3b8" stroke-width="2"/>
  <path d="M248 172 L248 300" stroke="#0f172a" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="248" y="162" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">mediana</text>
  <path d="M354 232 L354 300" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="354" y="222" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">p75</text>
  <circle cx="468" cy="278" r="9" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
  <text x="486" y="264" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#92400e">fora do padrão</text>
  <text x="70" y="326" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">contratos do segmento, ordenados por valor</text>
  <rect x="560" y="56" width="500" height="288" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
  <text x="590" y="94" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Peso dos fornecedores</text>
  <text x="590" y="118" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">quanto depende de poucos</text>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">
    <text x="590" y="153">Maior fornecedor</text>
    <text x="590" y="193">Segundo</text>
    <text x="590" y="233">Terceiro</text>
    <text x="590" y="273">Restantes</text>
  </g>
  <g>
    <rect x="740" y="140" width="290" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="740" y="140" width="180" height="16" rx="8" fill="#0f172a"/>
    <rect x="740" y="180" width="290" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="740" y="180" width="136" height="16" rx="8" fill="#334155"/>
    <rect x="740" y="220" width="290" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="740" y="220" width="58" height="16" rx="8" fill="#0ea5a4"/>
    <rect x="740" y="260" width="290" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="740" y="260" width="34" height="16" rx="8" fill="#38bdf8"/>
  </g>
  <rect x="590" y="294" width="230" height="32" rx="10" fill="#fef3c7"/>
  <text x="705" y="315" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Sinal: concentração alta</text>
  <rect x="40" y="368" width="1020" height="44" rx="14" fill="#0f172a"/>
  <text x="550" y="396" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">Os sinais apontam para onde olhar — não são prova de irregularidade.</text>
