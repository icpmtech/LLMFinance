  <rect x="88" y="130" width="120" height="10" rx="5" fill="#94a3b8"/>
  <g>
    <rect x="88" y="166" width="180" height="26" rx="8" fill="#0ea5a4"/>
    <rect x="88" y="212" width="216" height="26" rx="8" fill="#14b8a6"/>
