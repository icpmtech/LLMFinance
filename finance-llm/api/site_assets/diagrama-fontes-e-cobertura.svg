  <g>
    <rect x="70" y="126" width="16" height="16" rx="5" fill="#0ea5a4"/>
    <text x="100" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#334155">Portal BASE — contratos</text>
    <rect x="70" y="172" width="16" height="16" rx="5" fill="#14b8a6"/>
    <text x="100" y="186" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#334155">INE — finanças locais</text>
