    <rect x="818" y="146" width="112" height="42" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="874" y="173" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">França</text>
  </g>
  <text x="570" y="228" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#64748b">CONTRATOS DESDE</text>
  <rect x="570" y="244" width="460" height="16" rx="8" fill="#e2e8f0"/>
  <rect x="570" y="244" width="460" height="16" rx="8" fill="#0ea5a4"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">
    <text x="570" y="284">2012</text>
    <text x="1030" y="284" text-anchor="end">hoje</text>
  </g>
  <rect x="570" y="300" width="220" height="34" rx="10" fill="#0f172a"/>
  <text x="680" y="322" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Recolha contínua</text>
  <rect x="806" y="300" width="224" height="34" rx="10" fill="#fef3c7"/>
  <text x="918" y="322" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Fotografia datada</text>
  <rect x="40" y="404" width="1020" height="44" rx="14" fill="#0f172a"/>
  <text x="550" y="432" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">O que a fonte não publica fica em branco — dizemo-lo, em vez de estimar.</text>
