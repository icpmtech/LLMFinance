    <text x="100" y="324" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#334155">Recolhas próprias de preços</text>
  </g>
  <rect x="540" y="56" width="520" height="320" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
  <text x="570" y="94" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Cobertura</text>
  <text x="570" y="134" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#64748b">PAÍSES</text>
  <g>
    <rect x="570" y="146" width="112" height="42" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
