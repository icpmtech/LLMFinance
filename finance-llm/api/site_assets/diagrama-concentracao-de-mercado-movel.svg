<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 800" width="440" height="800" role="img" aria-label="Concentração de mercado e preço dentro do mesmo CPV">
  <rect width="440" height="800" fill="#f1f5f9"/>
  <rect x="16" y="16" width="408" height="340" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
  <text x="36" y="54" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Preço dentro do mesmo CPV</text>
  <text x="36" y="76" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b">mediana e percentis em vez de médias</text>
  <path d="M36 300 C90 300 110 170 165 170 C220 170 250 240 310 284 C350 300 380 300 404 300" fill="none" stroke="#0ea5a4" stroke-width="3"/>
  <path d="M36 300 L404 300" stroke="#94a3b8" stroke-width="2"/>
  <path d="M150 176 L150 300" stroke="#0f172a" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="150" y="166" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">mediana</text>
  <path d="M225 232 L225 300" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="225" y="222" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1" text-anchor="middle">p75</text>
  <circle cx="330" cy="285" r="8" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
  <text x="314" y="266" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#92400e" text-anchor="end">fora do padrão</text>
  <text x="36" y="326" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">contratos do segmento, ordenados por valor</text>
  <rect x="16" y="372" width="408" height="340" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
  <text x="36" y="410" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Peso dos fornecedores</text>
  <text x="36" y="432" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b">quanto depende de poucos</text>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">
    <text x="36" y="483">Maior fornecedor</text>
    <text x="36" y="525">Segundo</text>
    <text x="36" y="567">Terceiro</text>
    <text x="36" y="609">Restantes</text>
  </g>
  <g>
    <rect x="180" y="470" width="224" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="180" y="470" width="139" height="16" rx="8" fill="#0f172a"/>
    <rect x="180" y="512" width="224" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="180" y="512" width="108" height="16" rx="8" fill="#334155"/>
    <rect x="180" y="554" width="224" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="180" y="554" width="47" height="16" rx="8" fill="#0ea5a4"/>
    <rect x="180" y="596" width="224" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="180" y="596" width="27" height="16" rx="8" fill="#38bdf8"/>
  </g>
  <rect x="36" y="628" width="220" height="36" rx="10" fill="#fef3c7"/>
  <text x="146" y="651" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Sinal: concentração alta</text>
  <rect x="16" y="730" width="408" height="48" rx="14" fill="#0f172a"/>
  <text x="220" y="759" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#e2e8f0" text-anchor="middle">Sinais para olhar — não são prova de irregularidade.</text>
