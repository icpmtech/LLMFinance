    <rect x="48" y="636" width="144" height="22" rx="11" fill="#38bdf8"/>
    <rect x="48" y="674" width="376" height="22" rx="11" fill="#e2e8f0"/>
    <rect x="48" y="674" width="196" height="22" rx="11" fill="#0ea5a4"/>
    <rect x="48" y="712" width="376" height="22" rx="11" fill="#e2e8f0"/>
