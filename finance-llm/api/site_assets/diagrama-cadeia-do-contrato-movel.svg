    <text x="74" y="316" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Contrato</text>
    <text x="74" y="337" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569">por quanto e com quem</text>
  </g>
