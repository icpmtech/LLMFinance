<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 900" width="440" height="900" role="img" aria-label="Cadeia do contrato público: anúncio, concurso, adjudicação, contrato, aditivos e preço final">
  <rect width="440" height="900" fill="#f1f5f9"/>
  <g>
    <rect x="16" y="24" width="408" height="64" rx="14" fill="#ffffff" stroke="#dbe3ec"/>
