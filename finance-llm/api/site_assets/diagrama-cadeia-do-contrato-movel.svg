    <text x="74" y="52" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Anúncio</text>
    <text x="74" y="73" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b">o que se quer comprar</text>
  </g>
