  <text x="16" y="800" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b">Do anúncio ao preço final: o mesmo contrato em seis momentos.</text>
  <rect x="16" y="820" width="408" height="56" rx="14" fill="#0f172a"/>
  <text x="220" y="844" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#e2e8f0" text-anchor="middle">O que se mede: valor · procedimento</text>
  <text x="220" y="864" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#e2e8f0" text-anchor="middle">prazo até à assinatura · concorrência · CPV</text>
</svg>
