# IQ OS — solução completa em containers.
#
# Serviços "core" (arrancam sempre):  elasticsearch + backend (API FastAPI) + frontend (nginx/SPA)
# Serviços "tools":                   mcp   -> servidor MCP em HTTP (profile: tools)
# Serviços "test":                    tests -> pytest + smoke test da API (profile: test)
#
# Uso:
#   docker compose up --build -d                     # núcleo da solução
#   docker compose --profile tools up -d             # + servidor MCP (http://127.0.0.1:8765/mcp)
#   docker compose --profile test run --rm tests     # testes de dentro do container
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: finance-llm-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: iq-os-backend:latest
    container_name: finance-llm-backend
    ports:
      - "${FINANCE_API_PORT:-8003}:8000"
    volumes:
      - ./data:/app/data
      - ./model:/app/model
      - ./rag:/app/rag
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      # Nome do serviço do compose, não 127.0.0.1 (dentro do container o host é outro)
      - ELASTICSEARCH_URL=${FINANCE_ES_URL:-http://elasticsearch:9200}
      # Vazio => usa/reutiliza data/.auth_secret (sessões locais continuam válidas)
      - FINANCE_AUTH_SECRET=${FINANCE_AUTH_SECRET:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Mesma origem: o nginx faz proxy de /api/ para backend:8000
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: iq-os-frontend:latest
    container_name: finance-llm-frontend
    ports:
      - "${FINANCE_UI_PORT:-4180}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Servidor MCP do IQ OS em transporte HTTP (para o Inspector, agentes ou o VS Code).
  # Reutiliza a imagem do backend (mesmo código e dependências) e fala com o
  # backend pelo nome do serviço.
  mcp:
    image: iq-os-backend:latest
    container_name: finance-llm-mcp
    profiles: ["tools"]
    command: ["python", "-m", "mcp_server", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "${IQOS_MCP_PORT:-8765}:8765"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - IQOS_API_URL=${IQOS_API_URL:-http://backend:8000}
      - IQOS_API_TOKEN=${IQOS_API_TOKEN:-}
      - IQOS_API_EMAIL=${IQOS_API_EMAIL:-}
      - IQOS_API_PASSWORD=${IQOS_API_PASSWORD:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Testes executados *dentro* de Docker (pytest + smoke test dos endpoints).
  # Não arranca com "up": corre explicitamente com
  #   docker compose --profile test run --rm tests
  tests:
    image: iq-os-backend:latest
    container_name: finance-llm-tests
    profiles: ["test"]
    working_dir: /app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        python -m pytest tests -q &&
        python docker/smoke_test.py --base-url http://backend:8000 --ui-url http://frontend/
        --json /app/logs/smoke_test.json
    volumes:
      - ./data:/app/data
      - ./model:/app/model
      - ./rag:/app/rag
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ELASTICSEARCH_URL=${FINANCE_ES_URL:-http://elasticsearch:9200}
      - IQOS_API_TOKEN=${IQOS_API_TOKEN:-}
      - IQOS_API_EMAIL=${IQOS_API_EMAIL:-}
      - IQOS_API_PASSWORD=${IQOS_API_PASSWORD:-}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  es-data:
