# IQ OS — solução completa em containers.
#
# Serviços "core" (arrancam sempre):  elasticsearch + backend (API FastAPI) + frontend (nginx/SPA)
#                                     + searxng (metasearch) + n8n (automação)
# Serviços "tools":                   mcp   -> servidor MCP em HTTP (profile: tools)
# Serviços "agents":                  hermes-agent -> agente autónomo + dashboard (profile: agents)
# Serviços "mirofish":                mirofish -> previsão por enxame de agentes (profile: mirofish)
# Serviços "osif":                    osif-* -> OSINT Framework v2 do fr4nc1stein (profile: osif)
#
# Uso:
#   docker compose up --build -d                     # núcleo da solução
#   docker compose --profile tools up -d             # + servidor MCP (http://127.0.0.1:8765/mcp)
#   docker compose --profile agents up -d            # + Hermes Agent (dashboard na página iframe)
#   docker compose --profile mirofish up -d          # + MiroFish (precisa de chaves LLM + Zep)
#   docker compose --profile osif up -d --build      # + OSIF (página «OSINT Framework»)
#   docker compose --profile test run --rm tests     # testes de dentro do container

# ---------------------------------------------------------------------------
# OSIF (OSINT Framework v2) — variáveis comuns ao backend e ao worker.
#
# Ficam num campo de extensão (`x-`) com âncora YAML para não se repetirem nos
# dois serviços (é o worker que corre os módulos OSINT, por isso tem de ver as
# mesmas chaves). Ver `docker/osif/README.md`.
# ---------------------------------------------------------------------------
x-osif-env: &osif-env
  DATABASE_URL: postgresql+asyncpg://osif:${OSIF_DB_PASSWORD:-osif}@osif-postgres:5432/osif
  DATABASE_HOST: osif-postgres
  DATABASE_PORT: "5432"
  REDIS_HOST: osif-redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  EVIDENCE_STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://osif-minio:9000
  S3_BUCKET: ${OSIF_S3_BUCKET:-osif-evidence}
  S3_ACCESS_KEY: ${OSIF_MINIO_USER:-osif_minio}
  S3_SECRET_KEY: ${OSIF_MINIO_PASSWORD:-osif_minio_password}
  S3_REGION: us-east-1
  S3_FORCE_PATH_STYLE: "true"
  SECRET_KEY: ${OSIF_SECRET_KEY:-iq-os-osif-change-me}
  # Chaves OSINT — todas opcionais: sem elas funcionam dns_records,
  # subdomain_enum, whois_lookup, ip_geolocation, urlscan_lookup e email_domain.
  SHODAN_API_KEY: ${SHODAN_API_KEY:-}
  VT_API: ${VIRUSTOTAL_API_KEY:-${VT_API:-}}
  ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
  TOMBA_API_KEY: ${TOMBA_API_KEY:-}
  TOMBA_SECRET_KEY: ${TOMBA_SECRET_KEY:-}
  HUNTER_API_KEY: ${HUNTER_API_KEY:-}
  HIBP_API_KEY: ${HIBP_API_KEY:-}
  URLSCAN_API_KEY: ${URLSCAN_API_KEY:-}
  CENSYS_APPID: ${CENSYS_APPID:-}
  CENSYS_SECRET: ${CENSYS_SECRET:-}

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: finance-llm-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: iq-os-backend:latest
    container_name: finance-llm-backend
    ports:
      - "${FINANCE_API_PORT:-8003}:8000"
    volumes:
      - ./data:/app/data
      - ./model:/app/model
      - ./rag:/app/rag
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      # Nome do serviço do compose, não 127.0.0.1 (dentro do container o host é outro)
      - ELASTICSEARCH_URL=${FINANCE_ES_URL:-http://elasticsearch:9200}
      # MiroFish (módulo `/mirofish/*`): API do motor de simulação por enxame de
      # agentes, vista de dentro do container pelo nome do serviço. Fora do Docker
      # o backend usa `http://127.0.0.1:5001` (valor por omissão do módulo).
      - MIROFISH_URL=${MIROFISH_URL:-http://mirofish:5001}
      - MIROFISH_PUBLIC_URL=${MIROFISH_PUBLIC_URL:-}
      # Vazio => usa/reutiliza data/.auth_secret (sessões locais continuam válidas)
      - FINANCE_AUTH_SECRET=${FINANCE_AUTH_SECRET:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Mesma origem: o nginx faz proxy de /api/ para backend:8000
        VITE_API_URL: ${VITE_API_URL:-/api}
        # Apps incorporadas por iframe (vazio = host do browser + porta do compose)
        VITE_SEARXNG_URL: ${VITE_SEARXNG_URL:-}
        VITE_N8N_URL: ${VITE_N8N_URL:-}
        VITE_HERMES_URL: ${VITE_HERMES_URL:-}
        VITE_MIROFISH_URL: ${VITE_MIROFISH_URL:-}
        VITE_OSIF_URL: ${VITE_OSIF_URL:-}
    image: iq-os-frontend:latest
    container_name: finance-llm-frontend
    ports:
      - "${FINANCE_UI_PORT:-4180}:80"
      # Proxy de incorporação (iframe) das apps de apoio — ver docker/nginx.conf
      - "${N8N_EMBED_PORT:-8891}:8891"
      - "${HERMES_EMBED_PORT:-8892}:8892"
      - "${MIROFISH_EMBED_PORT:-8893}:8893"
      - "${OSIF_EMBED_PORT:-8894}:8894"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Metasearch self-hosted (SearXNG) — alimenta a página iframe «Pesquisa» e
  # pode ser usado como fonte de pesquisa pelos agentes.
  # Configuração própria em docker/searxng/settings.yml (JSON ligado, limiter off).
  searxng:
    image: searxng/searxng:latest
    container_name: finance-llm-searxng
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:${SEARXNG_PORT:-8888}/
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5
    restart: unless-stopped

  # n8n — automação de fluxos e agentes; a UI vive na página iframe «n8n».
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: finance-llm-n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./docker/n8n:/files
    environment:
      - N8N_HOST=127.0.0.1
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - GENERIC_TIMEZONE=Europe/Lisbon
      - TZ=Europe/Lisbon
      - WEBHOOK_URL=http://127.0.0.1:${N8N_PORT:-5678}/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    restart: unless-stopped

  # Hermes Agent (Nous Research) — agente autónomo. Traz:
  #   * API OpenAI-compatível + health em :8642 ("gateway run")
  #   * dashboard web em :9119 (HERMES_DASHBOARD=1) — é o que abre na página iframe.
  #
  # Fica no perfil "agents" porque o 1.º arranque passa pelo assistente de
  # configuração (chaves de API): `docker compose --profile agents run --rm hermes-agent setup`.
  # O estado (config, sessões, memórias) vive no volume `hermes-data` → /opt/data.
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: finance-llm-hermes-agent
    profiles: ["agents"]
    # Dois argumentos distintos: `["gateway run"]` (um só argumento) faz o
    # dispatcher responder «'gateway run' is not a hermes command».
    command: ["gateway", "run"]
    ports:
      # API OpenAI-compatível do gateway. O dashboard (9119) **não** é publicado
      # no host: só é acessível pelo proxy de incorporação do nginx (porto 8892),
      # que valida a sessão do IQ OS e injeta a credencial interna — ver
      # `docker/nginx.conf` (SSO com as mesmas contas da plataforma).
      - "${HERMES_API_PORT:-8642}:8642"
    volumes:
      - hermes-data:/opt/data
      # Provider de autenticação do dashboard: valida o login nas contas do IQ OS.
      - ./docker/hermes/plugins/dashboard-auth-iqos:/opt/data/plugins/dashboard-auth-iqos:ro
      # Ativa esse plugin em cada arranque (o estado de ativação vive no volume).
      - ./docker/hermes/init/026-enable-iqos-plugin.sh:/etc/cont-init.d/026-enable-iqos-plugin.sh:ro
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      # O dashboard não tem contas próprias: o formulário «Sign in with Username &
      # Password» é validado em `POST /auth/login` do IQ OS pelo plugin acima.
      - IQOS_API_URL=${IQOS_API_URL:-http://backend:8000}
      # Chave de assinatura das sessões do dashboard (32+ bytes). Vazio => por processo.
      - HERMES_DASHBOARD_IQOS_SECRET=${HERMES_DASHBOARD_IQOS_SECRET:-}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${HERMES_API_KEY:-iqos-hermes-api-key-please-change}
      - API_SERVER_CORS_ORIGINS=*
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    restart: unless-stopped

  # MiroFish (https://github.com/666ghj/MiroFish) — motor de previsão por
  # inteligência de enxame: extrai informação-semente do mundo real (notícias,
  # relatórios, histórias), constrói um mundo digital paralelo e simula
  # milhares de agentes com memória de longo prazo (Zep) para deduzir cenários.
  #
  # Imagem: oficial `ghcr.io/666ghj/mirofish` + um patch de uma linha — ver
  # `docker/mirofish/Dockerfile` (base da API em caminho relativo, para a app
  # funcionar incorporada por iframe e a partir de outra máquina).
  #
  # Perfil `mirofish` porque o backend **não arranca sem chaves**: o `run.py`
  # valida `LLM_API_KEY` e `ZEP_API_KEY` e sai com código 1 — com
  # `restart: unless-stopped` isso daria um ciclo de reinícios até estarem
  # definidas. Arranca com:
  #
  #   docker compose --profile mirofish up -d
  #
  # Chaves (ver `.env.example`):
  #   * MIROFISH_LLM_API_KEY / _BASE_URL / _MODEL_NAME — API compatível com
  #     OpenAI (por omissão reutiliza OPENAI_API_KEY/OPENAI_BASE_URL/OPENAI_MODEL);
  #   * MIROFISH_ZEP_API_KEY — Zep Cloud, memória de longo prazo dos agentes
  #     (plano gratuito em https://app.getzep.com/).
  mirofish:
    build:
      context: ./docker/mirofish
      args:
        MIROFISH_BASE_IMAGE: ${MIROFISH_BASE_IMAGE:-ghcr.io/666ghj/mirofish:latest}
    image: iq-os-mirofish:latest
    container_name: finance-llm-mirofish
    profiles: ["mirofish"]
    ports:
      # API Flask do MiroFish (útil para diagnóstico e para clientes externos).
      # O frontend **não** publica o porto do Vite (3000): é servido pelo proxy
      # de incorporação do nginx (`MIROFISH_EMBED_PORT`, 8893 por omissão), que
      # também serve para abrir a app diretamente no browser.
      - "${MIROFISH_API_PORT:-5001}:5001"
    volumes:
      # Projetos, materiais-semente, relatórios e simulações (backend/uploads).
      - mirofish-uploads:/app/backend/uploads
    environment:
      - TZ=Europe/Lisbon
      # LLM (formato OpenAI). Vazio => o backend recusa arrancar.
      - LLM_API_KEY=${MIROFISH_LLM_API_KEY:-${OPENAI_API_KEY:-}}
      - LLM_BASE_URL=${MIROFISH_LLM_BASE_URL:-${OPENAI_BASE_URL:-}}
      - LLM_MODEL_NAME=${MIROFISH_LLM_MODEL_NAME:-${OPENAI_MODEL:-}}
      # Memória de longo prazo dos agentes (Zep Cloud). Vazio => não arranca.
      - ZEP_API_KEY=${MIROFISH_ZEP_API_KEY:-${ZEP_API_KEY:-}}
      # Acelerador opcional (2.º modelo para tarefas de volume); vazio = desligado.
      - LLM_BOOST_API_KEY=${MIROFISH_LLM_BOOST_API_KEY:-}
      - LLM_BOOST_BASE_URL=${MIROFISH_LLM_BOOST_BASE_URL:-}
      - LLM_BOOST_MODEL_NAME=${MIROFISH_LLM_BOOST_MODEL_NAME:-}
      # Rondas de simulação por omissão. O README do MiroFish sugere menos de 40
      # nas primeiras tentativas: cada ronda chama o LLM para cada agente.
      - OASIS_DEFAULT_MAX_ROUNDS=${MIROFISH_MAX_ROUNDS:-10}
      # Idioma das respostas do LLM. Os prompts do upstream são em chinês e, sem
      # isto, as personas, as publicações dos agentes e as justificações saem em
      # chinês. Vazio = desligado (idioma do prompt).
      - MIROFISH_REPLY_LANGUAGE=${MIROFISH_REPLY_LANGUAGE:-pt-PT}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  # Servidor MCP do IQ OS em transporte HTTP (para o Inspector, agentes ou o VS Code).
  # Reutiliza a imagem do backend (mesmo código e dependências) e fala com o
  # backend pelo nome do serviço.
  #
  # Nota: o ENTRYPOINT da imagem do backend arranca o uvicorn; aqui é substituído
  # pelo próprio servidor MCP, senão o container serviria a API na porta errada.
  mcp:
    image: iq-os-backend:latest
    container_name: finance-llm-mcp
    profiles: ["tools"]
    entrypoint: ["python", "-m", "mcp_server"]
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "${IQOS_MCP_PORT:-8765}:8765"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - IQOS_API_URL=${IQOS_API_URL:-http://backend:8000}
      - IQOS_API_TOKEN=${IQOS_API_TOKEN:-}
      - IQOS_API_EMAIL=${IQOS_API_EMAIL:-}
      - IQOS_API_PASSWORD=${IQOS_API_PASSWORD:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), 3).close()"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # Testes executados *dentro* de Docker (pytest + smoke test dos endpoints).
  # Não arranca com "up": corre explicitamente com
  #   docker compose --profile test build tests     (usa a imagem do backend como base)
  #   docker compose --profile test run --rm tests
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: iq-os-tests:latest
    container_name: finance-llm-tests
    profiles: ["test"]
    working_dir: /app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        python -m pytest tests -q &&
        python docker/smoke_test.py --base-url http://backend:8000 --ui-url http://frontend/
        --json /app/logs/smoke_test.json
    volumes:
      - ./data:/app/data
      - ./model:/app/model
      - ./rag:/app/rag
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ELASTICSEARCH_URL=${FINANCE_ES_URL:-http://elasticsearch:9200}
      - IQOS_API_TOKEN=${IQOS_API_TOKEN:-}
      - IQOS_API_EMAIL=${IQOS_API_EMAIL:-}
      - IQOS_API_PASSWORD=${IQOS_API_PASSWORD:-}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # OSIF — OSINT Framework v2 (https://github.com/fr4nc1stein/osint-framework).
  #
  # Plataforma de investigação OSINT: FastAPI + Vue 3, com PostgreSQL (casos,
  # grafo, scans), Redis (fila arq + cache + rate limit), MinIO (evidências) e
  # um worker que corre os 11 módulos OSINT. O código vive em `docker/osif/src`
  # (clone local, ver `docker/osif/fetch.ps1` e `docker/osif/README.md`).
  #
  # A SPA do IQ OS incorpora a app pela porta 8894 (nginx de incorporação, que
  # reencaminha /api, /ws e /health para a API) — ver `docker/nginx.conf`.
  #
  # Arranca com: docker compose --profile osif up -d --build
  # ---------------------------------------------------------------------------
  osif-postgres:
    image: postgres:16-alpine
    container_name: finance-llm-osif-postgres
    profiles: ["osif"]
    environment:
      POSTGRES_DB: osif
      POSTGRES_USER: osif
      POSTGRES_PASSWORD: ${OSIF_DB_PASSWORD:-osif}
    volumes:
      - osif-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osif -d osif"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  osif-redis:
    image: redis:7-alpine
    container_name: finance-llm-osif-redis
    profiles: ["osif"]
    volumes:
      - osif-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # MinIO (servidor S3) para as evidências dos casos.
  #
  # Nota: o MinIO deixou de publicar imagens oficiais (Docker Hub e Quay: "pull
  # access denied" / "no such manifest"). Usa-se a imagem do Bitnami (arquivo
  # `bitnamilegacy`), que fala o mesmo S3 e cria o bucket por variável de
  # ambiente — o que dispensa o contentor `minio-init` do compose do upstream
  # (que precisava de `minio/mc`, também indisponível).
  osif-minio:
    image: bitnamilegacy/minio:latest
    container_name: finance-llm-osif-minio
    profiles: ["osif"]
    environment:
      MINIO_ROOT_USER: ${OSIF_MINIO_USER:-osif_minio}
      MINIO_ROOT_PASSWORD: ${OSIF_MINIO_PASSWORD:-osif_minio_password}
      # Buckets criados no arranque (o backend assume que existe).
      MINIO_DEFAULT_BUCKETS: ${OSIF_S3_BUCKET:-osif-evidence}
    ports:
      # Só a consola é publicada (diagnóstico); a API fica na rede interna.
      - "${OSIF_MINIO_CONSOLE_PORT:-9111}:9001"
    volumes:
      - osif-minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  osif-backend:
    build:
      context: ./docker/osif/src/backend
      dockerfile: Dockerfile
    image: iq-os-osif-backend:latest
    container_name: finance-llm-osif-backend
    profiles: ["osif"]
    ports:
      # API REST + WebSocket (para diagnóstico e clientes externos). A SPA
      # incorporada fala por ela através do nginx do IQ OS (porta 8894).
      - "${OSIF_API_PORT:-6110}:6000"
    environment:
      <<: *osif-env
      API_PORT: "6000"
      DEBUG: ${OSIF_DEBUG:-false}
      # A SPA é servida na mesma origem que a API (proxy), por isso o CORS não
      # é necessário; fica explícito para quem abrir a API diretamente.
      CORS_ORIGINS: '["http://127.0.0.1:4180","http://localhost:4180","http://127.0.0.1:8894","http://localhost:8894"]'
    depends_on:
      osif-postgres:
        condition: service_healthy
      osif-redis:
        condition: service_healthy
      osif-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 6
    restart: unless-stopped

  # Worker arq: é aqui que os módulos OSINT correm (o backend só os enfileira).
  osif-worker:
    build:
      context: ./docker/osif/src/backend
      dockerfile: Dockerfile
    image: iq-os-osif-backend:latest
    container_name: finance-llm-osif-worker
    profiles: ["osif"]
    command: ["arq", "app.tasks.worker.WorkerSettings"]
    environment:
      <<: *osif-env
      WORKER_CONCURRENCY: ${OSIF_WORKER_CONCURRENCY:-4}
      REQUEST_DELAY_MS: ${OSIF_REQUEST_DELAY_MS:-500}
    depends_on:
      osif-postgres:
        condition: service_healthy
      osif-redis:
        condition: service_healthy
      osif-backend:
        condition: service_healthy
    restart: unless-stopped

  # SPA do OSIF (Vue 3 compilado) — documento do iframe. Não publica porta: é
  # servida pelo proxy de incorporação do nginx do IQ OS (8894).
  osif-frontend:
    build:
      context: ./docker/osif
      dockerfile: frontend.Dockerfile
      args:
        VITE_MAPBOX_TOKEN: ${OSIF_MAPBOX_TOKEN:-}
    image: iq-os-osif-frontend:latest
    container_name: finance-llm-osif-frontend
    profiles: ["osif"]
    restart: unless-stopped

volumes:
  es-data:
