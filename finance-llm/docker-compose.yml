version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: finance-llm-backend
    ports:
      - "${FINANCE_API_PORT:-8003}:8000"
    volumes:
      - ./data:/app/data
      - ./model:/app/model
      - ./rag:/app/rag
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: finance-llm-frontend
    ports:
      - "${FINANCE_UI_PORT:-4180}:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=${VITE_API_URL:-}
