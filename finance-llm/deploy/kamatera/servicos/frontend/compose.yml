# Frontend (SPA) na VM -- quarto servico a migrar.
#
# A imagem `iq-os-frontend:latest` e construida localmente, por isso tem de ser
# transferida com o `15-imagem-vm.ps1` antes de arrancar isto:
#
#     .\15-imagem-vm.ps1 -Imagem iq-os-frontend:latest
#     .\14-servico-vm.ps1 -Nome frontend
#
# Tres diferencas face ao servico local (`docker-compose.yml`, na raiz):
#
#   1. **sem `depends_on: backend`** -- aqui o backend ainda nao existe, e com
#      essa dependencia o contentor nem arrancava;
#   2. porta presa a 127.0.0.1 e limite de memoria;
#   3. **sem `extra_hosts`**. O nginx tem `proxy_pass http://backend:8000`
#      gravado na imagem e faz `[emerg] host not found in upstream "backend"`
#      -- recusava arrancar enquanto o backend nao existia. Dava-se-lhe um
#      destino com `extra_hosts: backend:host-gateway`. Agora que o backend esta
#      migrado e na `iqos-net`, essa linha **tinha de sair**: as entradas de
#      `/etc/hosts` ganham ao DNS do Docker, por isso `backend` ficava preso ao
#      gateway -- o anfitriao da VM, onde nada escuta na 8000 -- e todo o
#      `/api` dava 502. Na mesma rede, o nome resolve para o contentor.
#
# As portas 8891-8894 do compose local servem os iframes (n8n, hermes, mirofish,
# osif) via `docker/nginx.conf`. Ficam de fora: sem esses servicos ligados seriam
# proxies para o vazio. Acrescentam-se quando eles migrarem.
services:
  frontend:
    image: iq-os-frontend:latest
    container_name: iqos-frontend
    ports:
      - "127.0.0.1:${FINANCE_UI_PORT:-4180}:80"
    environment:
      - TZ=Europe/Lisbon
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Rede partilhada por todos os servicos migrados. Sem isto cada projeto composes
# tem a sua rede e os servicos nao se resolvem por nome -- o frontend nao veria
# o `backend`, o backend nao veria o `elasticsearch`. O `14-servico-vm.ps1`
# cria-a se nao existir.
networks:
  default:
    name: iqos-net
    external: true
