# Backend do IQ OS na VM -- a peca central.
#
# Sem isto o modo `vm` do Caddy serve a SPA mas todas as chamadas `/api` dao 502.
# A imagem ja la esta (`iq-os-backend:latest`, 13,7 GB) e e reconstruida pelo
# `19-deploy-codigo.ps1` a cada mudanca de codigo.
#
#     .\14-servico-vm.ps1 -Nome backend
#
# Diferencas face ao `backend` do `docker-compose.yml` da raiz:
#
#   1. **sem `depends_on`** -- o Elasticsearch e um projeto composes separado,
#      logo `depends_on` nem o veria. A ordem e garantida pelo
#      `restart: unless-stopped`: se o ES ainda nao estiver pronto, o backend
#      tenta outra vez;
#   2. entra na `iqos-net`, onde resolve `elasticsearch` por nome (validado);
#   3. porta presa a 127.0.0.1;
#   4. `extra_hosts: host.docker.internal:host-gateway` para o Ollama, que por
#      omissao corre no anfitriao.
#
# Os volumes `data/`, `model/`, `rag/` e `logs/` ficam **vazios de proposito**
# (o `data/` sao 37 GB, deixados para depois). O backend arranca e serve o que
# vem do Elasticsearch -- que ja tem os 3,5 M documentos. O `data/` so faz falta
# para o que e lido do disco (segredos de sessao, ficheiros de apoio).
services:
  backend:
    image: iq-os-backend:latest
    container_name: iqos-backend
    ports:
      # Porta **fixa**, de proposito. O `14-servico-vm.ps1` copia o `.env` do PC
      # para aqui, e nesse `.env` esta `FINANCE_API_PORT=8002`. Com a
      # interpolacao `${FINANCE_API_PORT:-8000}` o contentor ficava na 8002
      # enquanto a sonda do script perguntava pela 8000 -- e o backend, que
      # estava bom, era dado como morto.
      # A porta do anfitriao da VM e uma decisao de instalacao: nao deve vir do
      # portatil de desenvolvimento.
      - "127.0.0.1:8002:8000"
    extra_hosts:
      # O Ollama corre no anfitriao por omissao (OLLAMA_URL abaixo).
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./model:/app/model
      - ./logs:/app/logs
      # ATENCAO: **nao** montar `./rag:/app/rag`. O `rag/` parece uma pasta de
      # dados mas e um **pacote Python que vive dentro da imagem**; montar por
      # cima uma pasta vazia tapa o codigo e o backend morre no arranque com
      #   ModuleNotFoundError: No module named 'rag.chat'
      # (o `api/rag_service.py` faz `from rag.chat.rag_engine import RagEngine`).
      # No compose da raiz isto nao acontece porque la a pasta tem os ficheiros.
      #
      # Biblioteca de skills do Hermes, so de leitura.
      - hermes-data:/hermes-data:ro
      # Modelos do faster-whisper: sem isto, cada recriacao volta a descarregar.
      - whisper-cache:/root/.cache/huggingface
      # Binares do Chromium para o Playwright/Scrapling.
      #
      # `playwright` (o pacote Python) vem de `scrapling[fetchers]`, mas os
      # **browsers** so chegam com `scrapling install` -- sao ~170 MB que o
      # Dockerfile nunca descarrega. Sem este volume, o `scrapling install`
      # escreve na camada de escrita do contentor e desaparece na recriacao
      # seguinte, e o sintoma so aparece quando alguem usa um template que
      # precisa de JavaScript:
      #   Executable doesn't exist at /root/.cache/ms-playwright/chromium-NNNN/...
      #
      # Nota, porque a licao do `rag/` aqui nao se aplica: montar por cima de
      # codigo da imagem e que e errado. Este caminho nao existe na imagem (so
      # tem `pip` dentro de `/root/.cache`), logo o volume nao tapa nada.
      # Confirmar com `docker run --rm --entrypoint ls iq-os-backend:latest /root/.cache`.
      - playwright-cache:/root/.cache/ms-playwright
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      # Nome do servico do compose, nao 127.0.0.1: dentro do contentor o host e
      # outro. `elasticsearch` resolve na `iqos-net`.
      - ELASTICSEARCH_URL=${FINANCE_ES_URL:-http://elasticsearch:9200}
      - MIROFISH_URL=${MIROFISH_URL:-http://mirofish:5001}
      - MIROFISH_PUBLIC_URL=${MIROFISH_PUBLIC_URL:-}
      - JARVIS_AGENT_URL=${JARVIS_AGENT_URL:-http://hermes-agent:8642}
      - JARVIS_AGENT_KEY=${HERMES_API_KEY:-iqos-hermes-api-key-please-change}
      - JARVIS_VOICE=${JARVIS_VOICE:-pt-PT-RaquelNeural}
      - JARVIS_AGENT_TIMEOUT=${JARVIS_AGENT_TIMEOUT:-300}
      - FINANCE_AUTH_SECRET=${FINANCE_AUTH_SECRET:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - JARVIS_WAKE_WORDS=${JARVIS_WAKE_WORDS:-}
      - JARVIS_WAKE_MODEL=${JARVIS_WAKE_MODEL:-tiny}
      - JARVIS_STT_MODEL=${JARVIS_STT_MODEL:-small}
      - TZ=Europe/Lisbon
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: iqos-net
    external: true

volumes:
  # O volume do Hermes, criado pelo projeto `hermes-agent`. Montado so de leitura.
  hermes-data:
    external: true
    name: hermes-agent_hermes-data
  whisper-cache:
  # Navegadores do Playwright. Enche-se uma vez com
  #   docker exec iqos-backend python -m playwright install --with-deps chromium
  # e depois sobrevive a recriacoes do contentor.
  playwright-cache:
