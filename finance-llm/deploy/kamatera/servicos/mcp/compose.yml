# MCP (Model Context Protocol) na VM -- setimo servico a migrar.
#
# Nao tem imagem propria: reusa `iq-os-backend:latest`, mudando so o entrypoint
# para `python -m mcp_server`. Por isso so pode arrancar **depois** de essa
# imagem chegar a VM (transferida com o `15-imagem-vm.ps1`):
#
#     .\15-imagem-vm.ps1 -Imagem iq-os-backend:latest
#     .\14-servico-vm.ps1 -Nome mcp
#
# Diferencas face ao perfil `tools` do `docker-compose.yml` da raiz:
#
#   1. **sem `depends_on: backend`**. No PC o mcp so arranca com o backend
#      saudavel; aqui o backend ainda nao esta a correr, e com essa dependencia o
#      contentor nem era criado. O `IQOS_API_URL` aponta para `http://backend:8000`
#      e passa a funcionar sozinho quando o backend entrar na `iqos-net`;
#   2. porta presa a 127.0.0.1;
#   3. entra na rede `iqos-net`, para poder falar com o backend e o Elasticsearch
#      por nome quando eles la estiverem.
#
# O `--host 0.0.0.0` no comando e de dentro do contentor: quem restringe o
# acesso e a publicacao de portas abaixo, nao o bind do servidor. Nesta VM, que
# nao tem firewall, e essa publicacao que impede o servico de ficar publico.
services:
  mcp:
    image: iq-os-backend:latest
    container_name: iqos-mcp
    entrypoint: ["python", "-m", "mcp_server"]
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "127.0.0.1:${IQOS_MCP_PORT:-8765}:8765"
    volumes:
      # Mesmos caminhos do compose local, mas vazios: o `data/` (37 GB) ficou
      # para depois, de proposito. O mcp usa-os para ler dados e escrever logs.
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - IQOS_API_URL=${IQOS_API_URL:-http://backend:8000}
      - IQOS_API_TOKEN=${IQOS_API_TOKEN:-}
      - IQOS_API_EMAIL=${IQOS_API_EMAIL:-}
      - IQOS_API_PASSWORD=${IQOS_API_PASSWORD:-}
    healthcheck:
      # Porto aberto em vez de HTTP: o endpoint MCP responde a POST com JSON-RPC,
      # nao a um GET simples, e um 405 faria o contentor parecer doente.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), 3).close()"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: iqos-net
    external: true
