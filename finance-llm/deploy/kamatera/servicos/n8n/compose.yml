# n8n na VM -- terceiro servico a migrar (depois de Elasticsearch e SearXNG).
#
# Espelha o servico local (`docker-compose.yml`, na raiz do finance-llm), com as
# mesmas duas adaptacoes dos outros:
#
#   1. porta presa a 127.0.0.1 -- a UI do n8n nao fica exposta a Internet;
#   2. limite de memoria, porque a VM tem 2 GB e o Elasticsearch ja ocupa a
#      maior parte.
#
# O `healthcheck` usa `/healthz`, que o n8n serve. Ainda assim, o
# `14-servico-vm.ps1` valida sobretudo por HTTP (ao contrario do searxng, aqui
# nao confio no healthcheck do proprio servico).
#
# Os dados ficam no volume `n8n-data` DESTA VM -- e uma instancia nova e vazia,
# nao uma copia da que corre no PC.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: iqos-n8n
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./files:/files
    environment:
      - N8N_HOST=127.0.0.1
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - GENERIC_TIMEZONE=Europe/Lisbon
      - TZ=Europe/Lisbon
      - WEBHOOK_URL=http://127.0.0.1:${N8N_PORT:-5678}/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  n8n-data:
