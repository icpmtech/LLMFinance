# Elasticsearch na VM do edge -- espelho do ES local.
#
# Objetivo: replica dos indices do PC, para poder migrar a stack aos poucos sem
# nunca tocar no que esta a correr. Este projeto e independente do `edge/`
# (Caddy + landing): `docker compose up` aqui so mexe no `iqos-elasticsearch`.
#
#   imagem ....... docker.elastic.co/elasticsearch/elasticsearch:8.11.0
#                 (a mesma versao do stack local -- ver docker-compose.yml)
#   configuracao . igual a local: single-node, sem seguranca
#   rede ......... `iqos-net` (bridge), publicando **so em 127.0.0.1:9200**
#   dados ........ volume nomeado `es_es-data`
#
# Porque bridge e nao `network_mode: host`
# ----------------------------------------
# Esteve em host networking para conseguir alcancar o `127.0.0.1:9201`, onde o
# tunel reverso publica o ES do PC (usado pelo `reindex` com `source.remote`).
# Mas isso tornava-o **invisivel para os outros contentores**: um contentor numa
# rede bridge nao chega ao loopback do host, e `host.docker.internal` resolve
# para o gateway da bridge -- onde o ES nao escuta. O backend precisa de
# `http://elasticsearch:9200` resolvido por nome, e nao havia maneira de o dar.
#
# Com bridge, o nome `elasticsearch` resolve na `iqos-net`. O que se perde: o ES
# deixa de alcancar o `127.0.0.1:9201` do tunel, portanto **uma re-sincronizacao
# de indices ja nao corre sozinha**. Opcoes:
#   - correr o reindex a partir do PC, empurrando com `elasticdump` por um tunel
#     de ida (`ssh -L`), que nao precisa de o ES sair para lado nenhum;
#   - ou pôr o ES em host networking temporariamente so durante a sincronizacao.
# A migracao inicial ja esta feita e validada, por isso isto so custa quando for
# preciso trazer indices novos.
#
# Nota de seguranca: esta VM **nao tem firewall** (`ufw` inativo, `iptables` sem
# regras). A unica coisa que impede um servico de ficar publico e estar preso a
# 127.0.0.1. E o que a publicacao abaixo garante.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: iqos-elasticsearch
    ports:
      # `127.0.0.1:` a frente e obrigatorio: sem ele o Docker publicaria em
      # 0.0.0.0 e, sem firewall, o cluster ficaria aberto a Internet.
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # **Aumentado de 512m para 2g em 2026-10-10.** Os 512m eram da VM de 2 GB;
      # com 8 GB de RAM e uma indexacao de 32 GB a entrar, meio giga e um garrote
      # silencioso: o `indices.memory.index_buffer_size` vale 10% do heap, logo
      # 51 MB de buffer. Medido, o `_bulk` andava a 9,5 MB/s -- e ha muito heap
      # livre para gastar (a VM usa ~3,2 GB com tudo a correr).
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      # Mantido para o caso de se voltar a sincronizar em host networking.
      - reindex.remote.whitelist=127.0.0.1:9201,host.docker.internal:9201
    ulimits:
      # Sem isto, o mlock falha e o JVM avisa que nao conseguiu travar a memoria.
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: iqos-net
    external: true

volumes:
  # Nomeado pelo projeto (`es_es-data`). Mantem-se entre recriacoes do contentor,
  # por isso mudar a rede nao perde os indices.
  es-data:
