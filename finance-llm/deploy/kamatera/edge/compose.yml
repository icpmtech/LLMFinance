# Edge do IQ OS na Kamatera com dominio proprio (sabemos.studio).
#
# Agora o proprio VM serve HTTPS (portas 80/443) via Caddy, com certificado
# Let's Encrypt automatico. Ainda proxy para o quick tunnel do PC de origem,
# mas o endereco publico e fixo: https://sabemos.studio
#
# IMPORTANTE: as portas 80 e 443 devem estar abertas no firewall da Kamatera.
services:
  caddy:
    image: caddy:2-alpine
    container_name: iqos-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    env_file:
      - edge.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
