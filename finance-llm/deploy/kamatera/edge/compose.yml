# Edge do IQ OS na Kamatera com dominio proprio (sabemos.studio).
#
# O proprio VM serve HTTPS (portas 80/443) via Caddy, com certificado
# Let's Encrypt automatico. O upstream e o PC, ligado por um **tunel SSH
# reverso** que publica a stack em `127.0.0.1:8080` desta VM — ver
# `deploy/kamatera/07-origin-tunnel.ps1`. Nao ha Cloudflare.
#
# O servico `landing` serve a pagina de apresentacao e o formulario de registo
# (guardado em JSON local). Fica no edge de proposito: e o que permite mostrar
# algo util e aceitar contactos **mesmo com a origem em baixo**.
#
# IMPORTANTE:
#   * `network_mode: host` no Caddy e obrigatorio: tem de falar com o
#     `127.0.0.1:8080` da **VM** (onde o tunel SSH liga) e com o `8090` da
#     landing, nao com o loopback do container.
#   * as portas 80 e 443 tem de estar abertas no firewall da Kamatera.
services:
  caddy:
    image: caddy:2-alpine
    container_name: iqos-caddy
    restart: unless-stopped
    environment:
      # De onde o site e servido. Ver o cabecalho do Caddyfile; muda-se com
      # `17-origem.ps1`. Por omissao, o PC (pelo tunel SSH reverso).
      ORIGEM_UPSTREAM: ${ORIGEM_UPSTREAM:-127.0.0.1:8080}
    # Partilha a rede do host: e o que permite chegar ao tunel SSH (127.0.0.1:8080).
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Nao ha ficheiro offline.html: a pagina de manutencao e servida pelo
      # servico `landing` (ver handle_errors no Caddyfile).
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # A API de administracao do Caddy (so em localhost) confirma que a
      # config esta carregada. Testar o site publico daria 308 (redirect
      # http->https), o que fazia o container parecer unhealthy.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  landing:
    build: ./landing
    image: iqos-landing:latest
    container_name: iqos-landing
    restart: unless-stopped
    # So no loopback da VM: quem chega de fora passa sempre pelo Caddy.
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      # Token para consultar a lista de registos (`GET /api/public/registo?token=`).
      REGISTOS_TOKEN: ${REGISTOS_TOKEN:-}
    volumes:
      # Os registos ficam no VM, em `edge/data/registos.json`.
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
