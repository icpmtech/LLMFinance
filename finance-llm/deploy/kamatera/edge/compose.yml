# Edge do IQ OS na Kamatera com dominio proprio (sabemos.studio).
#
# O proprio VM serve HTTPS (portas 80/443) via Caddy, com certificado
# Let's Encrypt automatico. O upstream e o PC, ligado por um **tunel SSH
# reverso** que publica a stack em `127.0.0.1:8080` desta VM — ver
# `deploy/kamatera/07-origin-tunnel.ps1`. Nao ha Cloudflare.
#
# O servico `landing` serve a pagina de apresentacao e o formulario de registo
# (guardado em JSON local). Fica no edge de proposito: e o que permite mostrar
# algo util e aceitar contactos **mesmo com a origem em baixo**.
#
# IMPORTANTE:
#   * `network_mode: host` no Caddy e obrigatorio: tem de falar com o
#     `127.0.0.1:8080` da **VM** (onde o tunel SSH liga) e com o `8090` da
#     landing, nao com o loopback do container.
#   * as portas 80 e 443 tem de estar abertas no firewall da Kamatera.
services:
  caddy:
    image: caddy:2-alpine
    container_name: iqos-caddy
    restart: unless-stopped
    environment:
      # De onde o site e servido. Ver o cabecalho do Caddyfile; muda-se com
      # `17-origem.ps1`. Por omissao, o PC (pelo tunel SSH reverso).
      ORIGEM_UPSTREAM: ${ORIGEM_UPSTREAM:-127.0.0.1:8080}
    # Partilha a rede do host: e o que permite chegar ao tunel SSH (127.0.0.1:8080).
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Nao ha ficheiro offline.html: a pagina de manutencao e servida pelo
      # servico `landing` (ver handle_errors no Caddyfile).
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # A API de administracao do Caddy (so em localhost) confirma que a
      # config esta carregada. Testar o site publico daria 308 (redirect
      # http->https), o que fazia o container parecer unhealthy.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  landing:
    build: ./landing
    image: iqos-landing:latest
    container_name: iqos-landing
    restart: unless-stopped
    # So no loopback da VM: quem chega de fora passa sempre pelo Caddy.
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      # Token para consultar a lista de registos (`GET /api/public/registo?token=`).
      REGISTOS_TOKEN: ${REGISTOS_TOKEN:-}
    volumes:
      # Os registos ficam no VM, em `edge/data/registos.json`.
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Mini portal de monitorizacao: servicos, imagens e estado da maquina.
  #
  # Existe **fora da solucao** de proposito. Um painel que precisasse do backend,
  # do frontend ou do Elasticsearch para se desenhar ficava em branco exactamente
  # quando faz falta -- e o sintoma confundir-se-ia com o problema. Este fala
  # directamente com o socket do Docker, por isso mostra o estado real mesmo com
  # a aplicacao toda em baixo.
  monitor:
    build: ./monitor
    image: iqos-monitor:latest
    container_name: iqos-monitor
    restart: unless-stopped
    # Rede do anfitriao: e o que permite sondar os servicos no `127.0.0.1:<porta>`
    # onde estao publicados (o `landing`, em bridge, nao os ve).
    #
    # Consequencia a ter em conta: com `network_mode: host` o `ports:` **nao se
    # aplica**. Quem decide o que fica exposto e o `MONITOR_BIND` do servidor, que
    # por omissao e `127.0.0.1` -- obrigatorio nesta VM, que nao tem firewall e
    # onde um bind a `0.0.0.0` deixaria o socket do Docker atras de um login.
    network_mode: host
    environment:
      PORT: "8091"
      BASE_PATH: /monitor
      MONITOR_BIND: 127.0.0.1
      # Sem isto o servidor recusa arrancar -- um painel sem password mostraria
      # o estado interno do servidor a quem passasse. Ver `edge/.env`.
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:-}
    volumes:
      # So de leitura. E o que permite saber o estado real dos contentores e das
      # imagens sem passar por nenhum servico da solucao -- que e o ponto do
      # painel. E, ao mesmo tempo, o poder de um root no anfitriao: por isso o
      # painel exige login e nao tem nenhum caminho de escrita.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
