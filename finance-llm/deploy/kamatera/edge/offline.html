<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IQ OS - temporariamente indisponivel</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1220;
            color: #e6edf7;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        }
        .card {
            max-width: 34rem;
            padding: 2.5rem;
            border: 1px solid #1f2b3f;
            border-radius: 16px;
            background: #101a2c;
            text-align: center;
        }
        h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
        p { margin: .5rem 0; color: #9fb0c9; line-height: 1.5; }
        .dot {
            display: inline-block;
            width: .6rem;
            height: .6rem;
            margin-right: .5rem;
            border-radius: 50%;
            background: #f0b429;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1><span class="dot"></span>IQ OS - origem offline</h1>
        <p>O edge na Kamatera esta no ar, mas a origem (a stack do IQ OS) nao
            responde neste momento.</p>
        <p>Causas habituais: o PC esta desligado, o tunel de origem caiu ou o
            backend ainda esta a arrancar.</p>
        <p>Assim que a origem voltar, esta pagina deixa de aparecer.</p>
    </div>
</body>

</html>
