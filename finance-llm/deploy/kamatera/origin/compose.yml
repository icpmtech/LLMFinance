# Origem do IQ OS sem Cloudflare: tunel SSH reverso PC -> VM do edge.
#
# O container publica a stack que corre neste PC (127.0.0.1:4180) no loopback
# da VM (`127.0.0.1:8080`); o Caddy dessa VM faz `reverse_proxy` para la, pelo
# que https://sabemos.studio fica servido sem depender de tuneis efemeros.
#
# O `07-origin-tunnel.ps1` escreve o `.env` (caminho da chave) e arranca isto.
#
#   docker compose -f deploy/kamatera/origin/compose.yml up -d
#   docker compose -f deploy/kamatera/origin/compose.yml logs -f
services:
  tunnel:
    build: .
    image: iqos-origin-tunnel:latest
    container_name: iqos-origin-tunnel
    restart: unless-stopped
    environment:
      SSH_HOST: ${SSH_HOST:-45.147.251.188}
      SSH_USER: ${SSH_USER:-root}
      REMOTE_PORT: ${REMOTE_PORT:-8080}
      # A stack do PC, vista de dentro do container.
      LOCAL_TARGET: ${LOCAL_TARGET:-host.docker.internal:4180}
      RETRY_SECONDS: ${RETRY_SECONDS:-5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # **So o ficheiro da chave**, nao a pasta `~/.ssh` inteira: o Docker
      # Desktop mata o container quando o bind e uma pasta que o host altera
      # (o proprio `ssh` escreve `known_hosts`), e o `restart: unless-stopped`
      # nao cobre um kill vindo do daemon.
      - ${SSH_KEY_PATH}:/key/id_ed25519:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
