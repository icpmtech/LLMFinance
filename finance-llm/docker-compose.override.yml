# Override temporário: usa a imagem existente mas sobrepõe o código atual do host.
# Remove/renomeia este ficheiro quando fizer build de imagens frescas.
services:
  backend:
    volumes:
      - ./api:/app/api:rw
      - ./chat:/app/chat:ro
      - ./chat-ui:/app/chat-ui:ro
      - ./cli:/app/cli:ro
      - ./collectors:/app/collectors:ro
      - ./deploy:/app/deploy:ro
      - ./forecasting:/app/forecasting:ro
      - ./inference:/app/inference:ro
      - ./processing:/app/processing:ro
      - ./rag:/app/rag
      - ./sentiment:/app/sentiment:ro
      - ./server.py:/app/server.py:ro
      - ./start.py:/app/start.py:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - ./data:/app/data
      - ./model:/app/model
      - ./logs:/app/logs
      # `exports/` (JSON societários e outros) e `debug_mj/` (HTML de diagnóstico)
      # não estavam montados: viviam só na camada do container e perdiam-se a cada
      # `docker compose up` que o recriasse (verificado a 2026-10-08 — o JSON do NIF
      # 514024674 desapareceu assim). Os ficheiros do container eram idênticos aos do
      # host antes de montar, por isso não se escondeu nada.
      - ./exports:/app/exports
      - ./debug_mj:/app/debug_mj

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
